name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle :app:assembleRelease --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk FluxUISystem-v1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OrbitPalette-apk
          path: FluxUISystem-*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Flux UI System v1.0.${{ github.run_number }}
          files: FluxUISystem-*.apk
          make_latest: true
